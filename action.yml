name: Touchstone
description: Check approved sentences against Cucumber and publish the trace on the pull request.
author: wosslabs
branding:
  icon: check-square
  color: blue
inputs:
  base:
    description: Pull request base SHA. Defaults to github.event.pull_request.base.sha.
    required: false
    default: ""
  command:
    description: Shell command that runs the acceptance tests, for example "npm run acceptance". Set it in the protected workflow, not in a file the agent can edit. Empty skips the run.
    required: false
    default: ""
  red-command:
    description: Shell command that runs ONE scenario, named by $TOUCHSTONE_SCENARIO (an anchored regex), for example 'npx cucumber-js --name "$TOUCHSTONE_SCENARIO"'. Each new or changed scenario must fail against the base production code. Empty skips the check.
    required: false
    default: ""
  setup:
    description: Shell command that prepares the base checkout for the red check, for example "npm ci".
    required: false
    default: ""
  comment:
    description: Post or update the trace comment on the pull request.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Fetch the base commit
      if: inputs.base != '' || github.event.pull_request.base.sha != ''
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
      run: git fetch --no-tags origin "$BASE"
    - name: Approved sentences did not shrink
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
      run: |
        if [ -n "$BASE" ]; then
          node "${{ github.action_path }}/ci/check-acceptance-guard.js" --base "$BASE"
        else
          node "${{ github.action_path }}/ci/check-acceptance-guard.js"
        fi
    - name: Sentences match Cucumber
      id: trace
      shell: bash
      run: |
        set +e
        node "${{ github.action_path }}/ci/check-trace.js" | tee "$RUNNER_TEMP/touchstone-trace.txt"
        echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
    - name: New scenarios fail before the code exists
      if: inputs.red-command != '' && (inputs.base != '' || github.event.pull_request.base.sha != '')
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        RED_COMMAND: ${{ inputs.red-command }}
        SETUP_COMMAND: ${{ inputs.setup }}
      run: node "${{ github.action_path }}/ci/check-red-green.js" --base "$BASE" --command "$RED_COMMAND" --setup "$SETUP_COMMAND"
    - name: Acceptance tests pass
      if: inputs.command != ''
      shell: bash
      env:
        ACCEPTANCE_COMMAND: ${{ inputs.command }}
      run: bash -c "$ACCEPTANCE_COMMAND"
    - name: Publish the trace
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        TRACE_FILE: ${{ runner.temp }}/touchstone-trace.txt
      with:
        script: |
          const fs = require('fs')
          const trace = fs.readFileSync(process.env.TRACE_FILE, 'utf8').trim()
          const marker = '<!-- touchstone-trace -->'
          const body = [
            marker,
            '### Touchstone trace',
            '',
            'Each approved sentence, the Cucumber scenario that runs it, and the step definition.',
            '',
            '```text',
            trace,
            '```',
            '',
          ].join('\n')
          const { owner, repo } = context.repo
          const issue_number = context.issue.number
          const comments = await github.rest.issues.listComments({
            owner, repo, issue_number, per_page: 100,
          })
          const existing = comments.data.find((comment) => comment.body && comment.body.includes(marker))
          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body,
            })
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            })
          }
    - name: Trace result
      shell: bash
      run: |
        if [ "${{ steps.trace.outputs.code }}" != "0" ]; then
          exit 1
        fi
