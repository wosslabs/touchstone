name: Touchstone
description: Check approved sentences against Cucumber and publish the trace on the pull request.
author: wosslabs
branding:
  icon: check-square
  color: blue
inputs:
  base:
    description: Pull request base SHA. Defaults to github.event.pull_request.base.sha.
    required: false
    default: ""
  command:
    description: Shell command that runs the acceptance tests, for example "npm run acceptance". Set it in the protected workflow, not in a file the agent can edit. Empty skips the run.
    required: false
    default: ""
  red-command:
    description: 'Shell command that runs ONE scenario, named by $TOUCHSTONE_SCENARIO (an anchored regex), and writes Cucumber messages or a Cucumber JSON report to $TOUCHSTONE_MESSAGES, for example npx cucumber-js --name "$TOUCHSTONE_SCENARIO" --format message:"$TOUCHSTONE_MESSAGES". Each new or changed scenario must fail at a Then step against the base production code. Empty skips the check.'
    required: false
    default: ""
  overlay:
    description: Comma-separated extra paths copied from the pull request onto the base checkout for the red check. features, stories, and src/acceptanceTest are always copied. Step definitions must live in these paths and must not depend on code the pull request adds.
    required: false
    default: ""
  red-batch:
    description: Set to "true" to run all new or changed scenarios in one pass per phase instead of one run each. Faster when starting the app is slow. The red-command must accept a regular expression with alternation in $TOUCHSTONE_SCENARIO.
    required: false
    default: "false"
  red-reason-unchecked:
    description: Set to "true" only for runners that can write neither Cucumber messages nor a Cucumber JSON report. The red check then accepts any failing run, and does not check the reason or the green run. Prefer a runner that writes messages.
    required: false
    default: "false"
  setup:
    description: Shell command that prepares the base checkout for the red check, for example "npm ci".
    required: false
    default: ""
  mutate:
    description: 'Gherkin value mutation: "off", "warn" or "fail". Changes one value at a time in each new or changed scenario (or in every scenario when a step definition changed) and expects the scenario to fail. A survivor means nothing checks that value. Defaults to the mutation.mode in touchstone.json, or "off". Uses the red-command to run one scenario.'
    required: false
    default: ""
  holdout-command:
    description: Shell command that fetches and runs held-back scenarios the agent never sees, for example from a private repository using a secret the agent cannot read. Runs after the acceptance command. Empty skips.
    required: false
    default: ""
  comment:
    description: Post or update the trace comment on the pull request.
    required: false
    default: "true"
outputs:
  failed_stage:
    description: The first stage that failed (guard, red, acceptance, quality, mutate, holdout or trace), or empty when everything passed.
    value: ${{ steps.report.outputs.failed }}
runs:
  using: composite
  steps:
    - name: Install Touchstone checks
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    - name: Fetch the base commit
      if: inputs.base != '' || github.event.pull_request.base.sha != ''
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
      run: git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE"
    - name: Read the gate config from the base commit
      id: config
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
      run: node "${{ github.action_path }}/ci/action-config.js" --repo . --base "$BASE"
    - name: Approved sentences did not shrink
      id: guard
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
      run: |
        {
          if [ -n "$BASE" ]; then
            node "${{ github.action_path }}/ci/check-acceptance-guard.js" --base "$BASE"
          else
            node "${{ github.action_path }}/ci/check-acceptance-guard.js"
          fi
        } 2>&1 | tee "$RUNNER_TEMP/touchstone-guard.txt"
    - name: Sentences match Cucumber
      id: trace
      if: always()
      shell: bash
      run: |
        set +e
        node "${{ github.action_path }}/ci/check-trace.js" | tee "$RUNNER_TEMP/touchstone-trace.txt"
        echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
    - name: New scenarios fail before the code exists
      id: red
      if: (inputs.red-command != '' || steps.config.outputs.red_command != '') && (inputs.base != '' || github.event.pull_request.base.sha != '')
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        RED_COMMAND: ${{ inputs.red-command || steps.config.outputs.red_command }}
        SETUP_COMMAND: ${{ inputs.setup || steps.config.outputs.setup }}
        OVERLAY: ${{ inputs.overlay }}
        UNCHECKED: ${{ inputs.red-reason-unchecked }}
        BATCH: ${{ inputs.red-batch }}
      run: |
        flags=()
        if [ "$UNCHECKED" = "true" ]; then
          flags+=(--any-failure)
        fi
        if [ "$BATCH" = "true" ]; then
          flags+=(--batch)
        fi
        node "${{ github.action_path }}/ci/check-red-green.js" --base "$BASE" --command "$RED_COMMAND" --setup "$SETUP_COMMAND" --overlay "$OVERLAY" "${flags[@]}" 2>&1 | tee "$RUNNER_TEMP/touchstone-red.txt"
    - name: Acceptance tests pass
      id: acceptance
      if: inputs.command != '' || steps.config.outputs.command != ''
      shell: bash
      env:
        ACCEPTANCE_COMMAND: ${{ inputs.command || steps.config.outputs.command }}
      run: bash -c "$ACCEPTANCE_COMMAND" 2>&1 | tee "$RUNNER_TEMP/touchstone-acceptance.txt"
    - name: Quality gates pass
      id: quality
      if: steps.config.outputs.quality != ''
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        GATES: ${{ steps.config.outputs.quality }}
      run: |
        {
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            node "${{ github.action_path }}/ci/gates.js" run "$name" --base "$BASE" --repo . || exit 1
          done <<< "$GATES"
        } 2>&1 | tee "$RUNNER_TEMP/touchstone-quality.txt"
    - name: Every value in a scenario is checked
      id: mutate
      if: (inputs.mutate != '' && inputs.mutate != 'off') || (inputs.mutate == '' && steps.config.outputs.mutate_mode != '' && steps.config.outputs.mutate_mode != 'off')
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        MODE: ${{ inputs.mutate || steps.config.outputs.mutate_mode }}
        MUTATE_COMMAND: ${{ inputs.red-command || steps.config.outputs.red_command }}
        MAX_MUTANTS: ${{ steps.config.outputs.mutate_max }}
        OVERLAY: ${{ inputs.overlay }}
      run: |
        flags=()
        if [ -n "$MAX_MUTANTS" ]; then
          flags+=(--max-mutants "$MAX_MUTANTS")
        fi
        node "${{ github.action_path }}/ci/mutate-gherkin.js" --repo . --base "$BASE" --command "$MUTATE_COMMAND" --mode "$MODE" --overlay "$OVERLAY" "${flags[@]}" 2>&1 | tee "$RUNNER_TEMP/touchstone-mutate.txt"
    - name: Held-back scenarios pass
      id: holdout
      if: inputs.holdout-command != ''
      shell: bash
      env:
        HOLDOUT_COMMAND: ${{ inputs.holdout-command }}
      run: bash -c "$HOLDOUT_COMMAND" 2>&1 | tee "$RUNNER_TEMP/touchstone-holdout.txt"
    - name: List driver changes
      if: always()
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
      run: |
        : > "$RUNNER_TEMP/touchstone-drivers.txt"
        if [ -n "$BASE" ]; then
          git diff --name-only "$BASE" HEAD -- features src/acceptanceTest package.json package-lock.json cucumber.js touchstone.json pom.xml build.gradle build.gradle.kts mvnw .mvn | grep -v '\.feature$' > "$RUNNER_TEMP/touchstone-drivers.txt" || true
        fi
    - name: Report which stage failed
      id: report
      if: always()
      shell: bash
      env:
        GUARD: ${{ steps.guard.outcome }}
        RED: ${{ steps.red.outcome }}
        ACCEPTANCE: ${{ steps.acceptance.outcome }}
        QUALITY: ${{ steps.quality.outcome }}
        MUTATE: ${{ steps.mutate.outcome }}
        HOLDOUT: ${{ steps.holdout.outcome }}
        TRACE: ${{ steps.trace.outputs.code }}
      run: |
        failed=""
        [ "$GUARD" = "failure" ] && failed="guard"
        [ -z "$failed" ] && [ "$RED" = "failure" ] && failed="red"
        [ -z "$failed" ] && [ "$ACCEPTANCE" = "failure" ] && failed="acceptance"
        [ -z "$failed" ] && [ "$QUALITY" = "failure" ] && failed="quality"
        [ -z "$failed" ] && [ "$MUTATE" = "failure" ] && failed="mutate"
        [ -z "$failed" ] && [ "$HOLDOUT" = "failure" ] && failed="holdout"
        [ -z "$failed" ] && [ -n "$TRACE" ] && [ "$TRACE" != "0" ] && failed="trace"
        echo "failed=$failed" >> "$GITHUB_OUTPUT"
        : > "$RUNNER_TEMP/touchstone-failure.txt"
        if [ -n "$failed" ] && [ -f "$RUNNER_TEMP/touchstone-$failed.txt" ]; then
          tail -n 60 "$RUNNER_TEMP/touchstone-$failed.txt" | tail -c 6000 > "$RUNNER_TEMP/touchstone-failure.txt"
        fi
        exit 0
    - name: Publish the trace
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        TRACE_FILE: ${{ runner.temp }}/touchstone-trace.txt
        DRIVERS_FILE: ${{ runner.temp }}/touchstone-drivers.txt
        FAILURE_FILE: ${{ runner.temp }}/touchstone-failure.txt
        FAILED_STAGE: ${{ steps.report.outputs.failed }}
      with:
        script: |
          const fs = require('fs')
          const read = (path) => { try { return fs.readFileSync(path, 'utf8').trim() } catch { return '' } }
          const trace = read(process.env.TRACE_FILE) || 'No trace was produced.'
          const drivers = read(process.env.DRIVERS_FILE)
          const failure = read(process.env.FAILURE_FILE)
          const stage = process.env.FAILED_STAGE
          const stages = {
            guard: 'An approved sentence was removed or reworded, or a test was switched off.',
            trace: 'A sentence, its Cucumber scenario and its step definition do not line up.',
            red: 'A new or changed scenario did not fail first, or failed for the wrong reason, or did not pass with this code.',
            acceptance: 'The acceptance tests failed.',
            quality: 'A quality gate failed.',
            mutate: 'A value in a scenario is not checked: changing it does not make the scenario fail.',
            holdout: 'The held-back scenarios failed.',
          }
          const status = stage
            ? [`### Touchstone: failed at **${stage}**`, '', stages[stage] || '', '']
            : ['### Touchstone: all checks passed', '']
          const failureSection = failure
            ? ['<details open><summary>Output of the failing stage (last lines)</summary>', '', '```text', failure, '```', '', '</details>', '']
            : []
          const marker = '<!-- touchstone-trace -->'
          const driverSection = drivers
            ? [
                '### Driver changes: review these',
                '',
                'Step definitions and support code sit between the approved sentence and the system. A dishonest driver makes every sentence pass.',
                '',
                '```text',
                drivers,
                '```',
                '',
              ]
            : []
          const body = [
            marker,
            ...status,
            ...failureSection,
            '### Touchstone trace',
            '',
            'Each approved sentence, the Cucumber scenario that runs it, and the step definition.',
            '',
            '```text',
            trace,
            '```',
            '',
            ...driverSection,
          ].join('\n')
          const { owner, repo } = context.repo
          const issue_number = context.issue.number
          const comments = await github.rest.issues.listComments({
            owner, repo, issue_number, per_page: 100,
          })
          const existing = comments.data.find((comment) => comment.body && comment.body.includes(marker))
          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body,
            })
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            })
          }
    - name: Trace result
      if: always()
      shell: bash
      run: |
        if [ "${{ steps.trace.outputs.code }}" != "0" ]; then
          exit 1
        fi
