# JVM version of acceptance-guard.yml (Cucumber-JVM with Maven).
# Copy to .github/workflows/acceptance-guard.yml. See examples/jvm-todo.
# Step definitions are found under src/test, features under features/.
name: Acceptance guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: wosslabs/touchstone@v0
        with:
          base: ${{ github.event.pull_request.base.sha }}
          command: ./mvnw -B verify
          # Unit tests (src/test) are skipped here: they reference new production
          # code that does not exist at the base commit. Acceptance scenarios live
          # in src/acceptanceTest and talk to the running app over HTTP only.
          red-command: ./mvnw -B -q verify -DskipUnitTests=true -Dcucumber.filter.name="$TOUCHSTONE_SCENARIO" -Dcucumber.plugin="message:$TOUCHSTONE_MESSAGES"
