# Copy this file to .github/workflows/acceptance-guard.yml
# `npx @wosslabs/touchstone init` does that.
# The action runs the sentence guard, the trace check, the acceptance command,
# and posts the trace on the pull request. The command lives here, in a
# protected file, so an agent cannot redefine what passing means.
# red-command runs each new or changed scenario against the base production
# code. It must fail there. A scenario that passes before any code changed is
# empty, or already built. Node.js is available on GitHub-hosted runners.
# The workflow needs permission to write a pull request comment.
name: Acceptance guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: wosslabs/touchstone@v1
        with:
          command: npm run acceptance
          setup: npm ci
          red-command: npx cucumber-js --name "$TOUCHSTONE_SCENARIO"
          base: ${{ github.event.pull_request.base.sha }}
