# Copy this file to .github/workflows/acceptance-guard.yml
# `npx @wosslabs/touchstone init` does that.
# The action runs the sentence guard, the trace check, and posts the trace
# on the pull request. Node.js is available on GitHub-hosted runners.
# The workflow needs permission to write a pull request comment.
name: Acceptance guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wosslabs/touchstone@v1
        with:
          base: ${{ github.event.pull_request.base.sha }}
