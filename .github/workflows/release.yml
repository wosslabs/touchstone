# Pushing a tag like v0.9.0 runs the tests, checks the tag and every plugin
# manifest match package.json, then moves the floating major tag (v0) to the
# same commit. Templates say `uses: wosslabs/touchstone@v0` while the project is
# 0.x. At 1.0.0 the templates must switch to @v1 in the same release commit.
# Create releases with: git tag -a v0.9.0 -m "Touchstone 0.9.0" && git push origin v0.9.0
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Tag and manifests match package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          for file in .claude-plugin/plugin.json .cursor-plugin/plugin.json; do
            found="$(node -p "require('./$file').version")"
            [ "$found" = "$version" ] || { echo "$file says $found, expected $version" >&2; exit 1; }
          done
          found="$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")"
          [ "$found" = "$version" ] || { echo "marketplace.json says $found, expected $version" >&2; exit 1; }
      - name: Templates use the major tag this release moves
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          if grep -rn "wosslabs/touchstone@v" templates examples --include=*.yml --include=README.md | grep -v "@$major\b"; then
            echo "some templates do not use @$major" >&2
            exit 1
          fi
      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
