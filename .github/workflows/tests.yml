name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests
        run: node --test tests/*.test.js
      - name: Action runs the trace
        uses: ./
        with:
          comment: "false"
  jvm-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: examples/jvm-todo/pom.xml
      - name: Run the JVM example scenarios
        working-directory: examples/jvm-todo
        run: ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Mutation testing of the code (PIT) meets its pass mark
        working-directory: examples/jvm-todo
        run: node quality/pit-gate.js --threshold 90 --require example.todo.TaskList --min-mutations 3
      - run: npm ci --ignore-scripts
      - name: Trace the JVM example
        run: node ci/check-trace.js --repo examples/jvm-todo
  typescript-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/typescript-todo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm test && npm run acceptance
  python-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python-todo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev python -m unittest discover -s tests
      - run: uv run --group dev behave
  go-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/golang-todo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: examples/golang-todo/go.sum
      - run: go test ./...
  rust-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/rust-todo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib && cargo test --test acceptance
  mojo-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/mojo-todo
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          run-install: false
          cache: false
      - uses: astral-sh/setup-uv@v5
      - name: Build and test the Mojo program
        run: |
          mkdir -p build
          pixi exec -c https://conda.modular.com/max -c conda-forge -s mojo -- mojo build src/todo.mojo -o build/todo
          pixi exec -c https://conda.modular.com/max -c conda-forge -s mojo -- mojo run -I src tests/test_tasks.mojo
      - run: uv run --group dev behave
  trace-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Trace every example
        run: |
          for example in web-todo typescript-todo python-todo jvm-todo golang-todo rust-todo mojo-todo; do
            echo "== $example"
            node ci/check-trace.js --repo "examples/$example"
          done
  jvm-attacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: examples/jvm-todo/pom.xml
      - name: Every Java attack must turn the gates red
        run: node attacks/run.js --suite jvm
  attacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: examples/typescript-todo
      - name: Every attack must turn the pipeline red
        run: npm run attacks
  legacy-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: examples/legacy-orders
      - name: The sentences are true of the legacy service
        run: npm run characterize
        working-directory: examples/legacy-orders
      - name: Every sentence points at real code
        run: node ci/check-evidence.js --repo examples/legacy-orders
